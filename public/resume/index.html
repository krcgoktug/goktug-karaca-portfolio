<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Göktuğ Karaca — Résumé</title>
    <meta name="description" content="Göktuğ Karaca résumé." />
    <link rel="icon" type="image/svg+xml" href="/assets/gk-favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Space+Mono:wght@400;700&display=swap"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("gk-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <style>
      :root {
        --paper: #0c0c0d;
        --paper-2: #141415;
        --ink: #f3efe4;
        --ink-2: #9e988c;
        --rule: rgba(243, 239, 228, 0.18);
        --accent: #ff4d17;
        --accent-ink: #0c0c0d;
      }

      [data-theme="light"] {
        --paper: #efebe0;
        --paper-2: #e4dfd2;
        --ink: #14120f;
        --ink-2: #6b655a;
        --rule: rgba(20, 18, 15, 0.2);
        --accent: #dd3c00;
        --accent-ink: #fbf8f1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        padding: clamp(0.9rem, 3vw, 2rem);
        gap: 0.9rem;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--rule);
        padding-bottom: 0.9rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.15rem, 3.4vw, 1.9rem);
        font-weight: 800;
        letter-spacing: -0.04em;
        text-transform: uppercase;
      }

      .actions {
        display: flex;
        gap: 0.45rem;
        flex-wrap: wrap;
      }

      .btn {
        font-family: "Space Mono", ui-monospace, Consolas, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--ink);
        border: 1px solid var(--rule);
        padding: 0.55rem 0.9rem;
        transition: background 240ms, color 240ms, border-color 240ms;
      }

      .btn:hover {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
      }

      .viewer {
        flex: 1;
        min-height: 70vh;
        border: 1px solid var(--rule);
        background: var(--paper-2);
        overflow: hidden;
      }

      .viewer iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      .fallback {
        padding: 1.6rem;
        color: var(--ink-2);
      }
    </style>
  </head>
  <body>
    <header class="bar">
      <h1>Göktuğ Karaca — Résumé</h1>
      <div class="actions">
        <a class="btn" href="/">← Back to site</a>
        <a class="btn" href="/Goktug_Karaca_Resume.pdf" target="_blank" rel="noreferrer">Open PDF ↗</a>
        <a class="btn" href="/Goktug_Karaca_Resume.pdf" download>Download</a>
      </div>
    </header>

    <main class="viewer" aria-label="Résumé PDF">
      <iframe src="/Goktug_Karaca_Resume.pdf#view=FitH" title="Göktuğ Karaca résumé PDF">
        <div class="fallback">
          Your browser cannot display the PDF inline.
          <a class="btn" href="/Goktug_Karaca_Resume.pdf" target="_blank" rel="noreferrer">Open PDF</a>
        </div>
      </iframe>
    </main>
  </body>
</html>
